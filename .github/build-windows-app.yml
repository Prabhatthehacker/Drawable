name: Build Drawable (single Windows exe)

# Run it by hand: GitHub repo -> Actions tab -> "Build Drawable (single Windows exe)" -> Run workflow.
# The result is ONE file, Drawable.exe, with everything packed inside (no separate folder).
# It appears in TWO places: the Artifacts box at the bottom of the run page,
# and the repo's Releases page (right-hand side of the repo's main page).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build the app
        shell: pwsh
        run: |
          pyinstaller paint_ai.py --noconfirm --clean --onefile --windowed --name Drawable `
            --exclude-module matplotlib --exclude-module IPython --exclude-module pytest `
            --collect-submodules diffusers `
            --collect-submodules transformers `
            --collect-data diffusers `
            --collect-data transformers `
            --recursive-copy-metadata diffusers `
            --recursive-copy-metadata transformers `
            --recursive-copy-metadata huggingface_hub `
            --recursive-copy-metadata tokenizers `
            --recursive-copy-metadata safetensors `
            --recursive-copy-metadata numpy `
            --recursive-copy-metadata tqdm `
            --recursive-copy-metadata requests `
            --recursive-copy-metadata packaging `
            --recursive-copy-metadata filelock `
            --recursive-copy-metadata regex `
            --recursive-copy-metadata pyyaml `
            --recursive-copy-metadata accelerate `
            --copy-metadata torch

      - name: Check the app starts
        shell: pwsh
        run: |
          if (-not (Test-Path dist/Drawable.exe)) { throw "Drawable.exe was not built" }
          Write-Host ("Drawable.exe size: {0:N0} MB" -f ((Get-Item dist/Drawable.exe).Length / 1MB))
          $p = Start-Process dist/Drawable.exe -PassThru
          Start-Sleep -Seconds 60
          if ($p.HasExited) { throw "Drawable.exe closed by itself (exit code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Drawable.exe started and stayed open."

      - name: Upload as a downloadable artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Drawable-exe
          path: dist/Drawable.exe
          compression-level: 0
          retention-days: 14

      - name: Publish to Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "build-${{ github.run_number }}" }
          gh release create $tag dist/Drawable.exe --title "Drawable $tag" --notes "Download Drawable.exe and double-click it. It is one file. The first start takes a little while."
          "Your app is on the Releases page of this repo: build tag $tag (file Drawable.exe)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
